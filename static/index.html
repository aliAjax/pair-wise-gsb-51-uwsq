<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>住房贷款纾困申请与履约跟踪</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 1080px; margin: auto; }
    button { padding: .5rem .9rem; cursor: pointer; }
    input { padding: .45rem .6rem; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
    table { border-collapse: collapse; width: 100%; margin: .5rem 0 1rem; font-size: .92rem; }
    th, td { border: 1px solid #d5dbe1; padding: .4rem .6rem; text-align: left; }
    th { background: #eef2f5; }
    tr.paid td { background: #e9f7ee; }
    tr.partial td { background: #fff7e0; }
    tr.overdue td { background: #fde8e8; }
    .badge { display: inline-block; padding: .12rem .6rem; border-radius: 999px; background: #e8edf2; font-size: .85rem; }
    .badge.active { background: #dbeafe; color: #1d4ed8; }
    .badge.cured { background: #d8f0e2; color: #0a7a3d; }
    .badge.defaulted { background: #fadbd8; color: #b3261e; }
    .trigger-cured { color: #0a7a3d; font-weight: 600; }
    .trigger-defaulted { color: #b3261e; font-weight: 600; }
    section { margin-top: 1.6rem; }
    h2 { font-size: 1.05rem; margin-bottom: .4rem; }
    .muted { color: #5b6b7b; font-size: .88rem; }
    #detail { display: none; }
    .event { border-left: 3px solid #c4cdd6; padding: .3rem .8rem; margin: .35rem 0; }
    .event.cured { border-color: #0a7a3d; background: #f0faf4; }
    .event.defaulted { border-color: #b3261e; background: #fdf3f2; }
  </style>
</head>
<body>
<main>
  <h1>住房贷款纾困申请与履约跟踪</h1>
  <section>
    <div class="row">
      <button id="load">加载记录</button>
      <button id="stats">查看状态统计</button>
    </div>
    <div id="records"></div>
    <pre id="output">点击“加载记录”选择一笔记录，逐期查看履约情况。</pre>
  </section>

  <section id="detail">
    <h2>记录 <span id="rec-title"></span> <span id="rec-state" class="badge"></span></h2>
    <div class="muted" id="rec-meta"></div>

    <h2>逐期还款计划</h2>
    <table id="schedule">
      <thead><tr><th>期数</th><th>应还日</th><th>宽限截止</th><th>应还</th><th>实还</th><th>剩余</th><th>状态</th></tr></thead>
      <tbody></tbody>
    </table>

    <h2>还款流水</h2>
    <table id="payments">
      <thead><tr><th>#</th><th>还款时间</th><th>金额</th><th>分配期次</th><th>还款后状态</th><th>触发</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="muted" id="evaluation"></div>

    <h2>履约操作</h2>
    <div class="row">
      <input id="pay-amount" type="number" min="0.01" step="0.01" placeholder="还款金额">
      <input id="pay-at" type="text" placeholder="还款时间(可选,如2026-02-01)">
      <button id="pay">登记还款</button>
      <input id="eval-at" type="text" placeholder="评估时点(可选)">
      <button id="evaluate">履约评估</button>
    </div>

    <h2>审计时间线</h2>
    <div id="timeline"></div>
  </section>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo"};
const STATE_LABELS = {submitted:"已提交",assessed:"已评估",approved:"已批准",active:"履约中",cured:"已恢复",defaulted:"已违约"};
let current = null;

async function api(path, options) {
  const response = await fetch(path, Object.assign({headers}, options || {}));
  const data = await response.json();
  if (!response.ok) throw new Error(data.message || ("请求失败 " + response.status));
  return data;
}
function money(v) { return Number(v).toFixed(2); }
function stateLabel(s) { return STATE_LABELS[s] || s; }

async function loadRecords() {
  const data = await api("/api/records?limit=50");
  const box = document.getElementById("records");
  if (!data.items.length) { box.innerHTML = "<p class='muted'>暂无记录</p>"; return; }
  const rows = data.items.map(r =>
    `<tr><td>${r.id}</td><td>${r.reference}</td><td><span class="badge ${r.state}">${stateLabel(r.state)}</span></td><td>v${r.version}</td><td><button data-id="${r.id}">查看履约</button></td></tr>`
  ).join("");
  box.innerHTML = `<table><thead><tr><th>ID</th><th>编号</th><th>状态</th><th>版本</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  box.querySelectorAll("button").forEach(b => b.onclick = () => openRecord(Number(b.dataset.id)));
}

async function openRecord(id) {
  try {
    current = await api("/api/records/" + id);
    renderDetail();
    await loadTimeline();
    document.getElementById("detail").style.display = "block";
  } catch (err) { alert(err.message); }
}

function periodStatus(p) {
  const outstanding = +(p.due_amount - p.paid_amount).toFixed(2);
  if (outstanding <= 0) return ["已结清", "paid"];
  const today = new Date().toISOString().slice(0, 10);
  if (today > p.grace_deadline) return ["已过宽限未补足", "overdue"];
  if (p.paid_amount > 0) return ["部分还款(宽限内)", "partial"];
  return ["待还款", ""];
}

function renderDetail() {
  const r = current, p = r.payload;
  document.getElementById("rec-title").textContent = "#" + r.id + " " + r.reference;
  const badge = document.getElementById("rec-state");
  badge.textContent = stateLabel(r.state);
  badge.className = "badge " + r.state;
  document.getElementById("rec-meta").textContent =
    `方案 ${p.approved_program || p.program_type} · 期数 ${p.approved_months ?? "-"} · 每期应还 ${p.approved_payment ?? "-"} · 宽限 ${p.grace_days ?? "-"} 天 · 版本 v${r.version}`;

  const schedule = p.schedule || [];
  document.querySelector("#schedule tbody").innerHTML = schedule.map(per => {
    const [label, cls] = periodStatus(per);
    const rest = Math.max(0, +(per.due_amount - per.paid_amount).toFixed(2));
    return `<tr class="${cls}"><td>第${per.period}期</td><td>${per.due_date}</td><td>${per.grace_deadline}</td><td>${money(per.due_amount)}</td><td>${money(per.paid_amount)}</td><td>${money(rest)}</td><td>${label}</td></tr>`;
  }).join("") || `<tr><td colspan="7" class="muted">尚未生成还款计划（方案生效后自动生成）</td></tr>`;

  const payments = p.payments || [];
  document.querySelector("#payments tbody").innerHTML = payments.map(pay => {
    const alloc = pay.allocations.map(a => `第${a.period}期 ${money(a.amount)}`).join("，");
    const trigger = pay.trigger === "cured" ? `<span class="trigger-cured">触发恢复</span>`
      : pay.trigger === "defaulted" ? `<span class="trigger-defaulted">触发违约</span>` : "—";
    return `<tr><td>${pay.seq}</td><td>${pay.paid_at}</td><td>${money(pay.amount)}</td><td>${alloc}</td><td>${stateLabel(pay.state_after)}</td><td>${trigger}</td></tr>`;
  }).join("") || `<tr><td colspan="6" class="muted">暂无还款</td></tr>`;

  const ev = p.last_evaluation;
  document.getElementById("evaluation").textContent = ev
    ? `最近评估：${ev.as_of} · 未结清 ${money(ev.outstanding_total)} 元 · 连续错过宽限 ${ev.missed_streak} 期 · 结论：${stateLabel(ev.result)}`
    : "尚未进行履约评估";
}

async function loadTimeline() {
  const data = await api("/api/records/" + current.id + "/audit");
  document.getElementById("timeline").innerHTML = data.items.map(ev => {
    const d = ev.details || {};
    const cls = d.to === "cured" ? "cured" : d.to === "defaulted" ? "defaulted" : "";
    let extra = "";
    if (d.payment) extra += ` · 还款#${d.payment.seq} 金额${money(d.payment.amount)}`;
    if (d.from && d.to && d.from !== d.to) extra += ` · 状态 ${stateLabel(d.from)} → ${stateLabel(d.to)}`;
    return `<div class="event ${cls}"><strong>${ev.action}</strong> ${d.summary || ""}${extra} <span class="muted">${ev.actor_id} · ${ev.created_at}</span></div>`;
  }).join("");
}

async function act(action, data) {
  try {
    current = await api(`/api/records/${current.id}/actions/${action}`, {
      method: "POST",
      headers: Object.assign({"Content-Type": "application/json"}, headers),
      body: JSON.stringify({expected_version: current.version, data})
    });
    renderDetail();
    await loadTimeline();
  } catch (err) { alert(err.message); }
}

document.getElementById("pay").onclick = () => {
  if (!current) { alert("请先选择记录"); return; }
  const amount = parseFloat(document.getElementById("pay-amount").value);
  if (!(amount > 0)) { alert("请输入还款金额"); return; }
  const paidAt = document.getElementById("pay-at").value.trim();
  const data = {amount};
  if (paidAt) data.paid_at = paidAt;
  act("payment", data);
};
document.getElementById("evaluate").onclick = () => {
  if (!current) { alert("请先选择记录"); return; }
  const asOf = document.getElementById("eval-at").value.trim();
  act("evaluate", asOf ? {as_of: asOf} : {});
};
document.getElementById("load").onclick = () => loadRecords().catch(err => alert(err.message));
document.getElementById("stats").onclick = async () => {
  try {
    document.getElementById("output").textContent = JSON.stringify(await api("/api/stats"), null, 2);
  } catch (err) { alert(err.message); }
};
</script>
</body>
</html>
